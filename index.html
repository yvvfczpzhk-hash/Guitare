<style>
:root {
  --bg: #100e0c; --bg2: #161310; --surface: #1d1915; --surface2: #27211b; --line: #382f26;
  --text: #f4eee5; --muted: #ab9f90; --faint: #776c5f;
  --accent: #f0a04b; --accent-ink: #1d1206; --accent2: #6fc7b2;
  --good: #6fd29a; --warn: #f2c14e; --bad: #ff7a6b; --info: #7fb0ff;
  --wood: #c98b4f; --string: #d9d2c5; --fret: #8a7d6d;
  --radius: 16px; --gap: 14px;
  --shadow: 0 6px 24px rgba(0,0,0,.38);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f7f2ea; --bg2: #efe8dd; --surface: #ffffff; --surface2: #f3ece2; --line: #e3d9cb;
    --text: #1f1a15; --muted: #62584d; --faint: #8d8274; --accent: #c7701f; --accent-ink: #ffffff; --accent2: #2c8f7b;
    --good: #1f9d62; --warn: #a77b07; --bad: #d64545; --info: #2d6fd6; --wood: #a86b33; --string: #4a4036; --fret: #9c8f80;
    --shadow: 0 6px 20px rgba(60,40,10,.10); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f7f2ea; --bg2: #efe8dd; --surface: #ffffff; --surface2: #f3ece2; --line: #e3d9cb;
  --text: #1f1a15; --muted: #62584d; --faint: #8d8274; --accent: #c7701f; --accent-ink: #ffffff; --accent2: #2c8f7b;
  --good: #1f9d62; --warn: #a77b07; --bad: #d64545; --info: #2d6fd6; --wood: #a86b33; --string: #4a4036; --fret: #9c8f80;
  --shadow: 0 6px 20px rgba(60,40,10,.10); color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; min-height: 100dvh; overscroll-behavior-y: none; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3 { margin: 0; line-height: 1.2; letter-spacing: -0.01em; }
h1 { font-size: 26px; font-weight: 750; }
h2 { font-size: 19px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 650; }
p { margin: 0; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.small { font-size: 13.5px; } .tiny { font-size: 12px; } .center { text-align: center; }
.row { display: flex; gap: 10px; align-items: center; } .row.wrap { flex-wrap: wrap; } .row.between { justify-content: space-between; }
.col { display: flex; flex-direction: column; gap: 10px; } .grow { flex: 1; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#app { max-width: 560px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); }
.topbar { position: sticky; top: 0; z-index: 5; background: var(--bg); box-shadow: 0 10px 12px -14px rgba(0,0,0,.35); padding: calc(12px + env(safe-area-inset-top)) 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-weight: 800; letter-spacing: .16em; font-size: 15px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
.brand i { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.screen { display: flex; flex-direction: column; gap: var(--gap); padding-top: 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; }
.card.hero { background: linear-gradient(160deg, var(--surface2), var(--surface)); }
.card h2 + p, .card h3 + p { margin-top: 6px; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface2); border-radius: 14px; padding: 13px 16px; min-height: 48px; font-weight: 650; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: var(--text); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn.big { min-height: 60px; font-size: 18px; border-radius: 18px; }
.btn.small { min-height: 38px; padding: 8px 12px; font-size: 14px; border-radius: 11px; white-space: nowrap; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn.good { background: color-mix(in srgb, var(--good) 22%, var(--surface2)); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.btn.warnb { background: color-mix(in srgb, var(--warn) 20%, var(--surface2)); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.btn.badb { background: color-mix(in srgb, var(--bad) 18%, var(--surface2)); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.btn.sel { outline: 2px solid var(--accent); outline-offset: 1px; }

    return { best: best ? best.id : null, score: bs, margin: bs - Math.max(0, second), sim };
  };
  /** Petite décomposition non négative (descente par coordonnées) sur quelques gabarits de notes. */
  function fitNotes(atoms, o, iters) {
    const K = atoms.length, a = new Float64Array(K), G = [], bv = [];
    for (let p = 0; p < K; p++) { G.push(new Float64Array(K)); let v = 0; for (let i = 0; i < NS; i++) v += atoms[p][i] * o[i]; bv.push(v); }
    for (let p = 0; p < K; p++) for (let q = 0; q < K; q++) { let v = 0; for (let i = 0; i < NS; i++) v += atoms[p][i] * atoms[q][i]; G[p][q] = v; }
    for (let it = 0; it < (iters || 40); it++) for (let k = 0; k < K; k++) { let r = bv[k]; for (let q = 0; q < K; q++) if (q !== k) r -= G[k][q] * a[q]; a[k] = Math.max(0, r / (G[k][k] || 1e-12)); }
    let res = 0, tot = 0;
    for (let i = 0; i < NS; i++) { let f = 0; for (let k = 0; k < K; k++) f += a[k] * atoms[k][i]; res += (o[i] - f) * (o[i] - f); tot += o[i] * o[i]; }
    return { a, rel: tot > 0 ? res / tot : 1 };
  }
  /**
   * Diagnostic d'un accord attendu (coup gratté) : erreurs typiques testées une à une — corde jouée à vide au lieu
   * de sa case, case voisine, corde censée être étouffée qui sonne — et notes uniques absentes (corde étouffée).
   * Une erreur n'est retenue que si elle explique nettement mieux le spectre que l'accord seul.
   * @returns {foreign:[{s, kind, note}], missing:[{s, note}], fit}
   */
  D.chordDiagnosis = function (obs, v, a4, exclude) {
    if (!obs || obs.len < 8192) return { foreign: [], missing: [], fit: null, short: true };   // trop court : pas de diagnostic fiable
    const notes = T.voicingNotes(v);
    const base = [], idx = [];
    notes.forEach((n, s) => { if (n != null) { base.push(noteAtom(n, a4)); idx.push(s); } });
    const o = obs.lin;
    const f0 = fitNotes(base, o);
    const foreign = [];
    const tries = [];
    // erreurs testées sur la forme (avec capo, une corde « à vide » sonne à la case du capo)
    const cp = v.capo || 0, shapeFrets = v.shape ? v.shape.frets : v.frets;
    shapeFrets.forEach((f, s) => {
      const open = T.OPEN[s] + cp;
      if (f > 0) { tries.push({ s, kind: 'open', note: open }); tries.push({ s, kind: 'fret+1', note: open + f + 1 }); if (f > 1) tries.push({ s, kind: 'fret-1', note: open + f - 1 }); }
      else if (f < 0) tries.push({ s, kind: 'mute', note: open });
    });
    for (const tr of tries) {
      if (notes.some(n => n != null && (n === tr.note))) continue;           // déjà une note de l'accord
      if (exclude && exclude.includes(tr.note)) continue;                     // note qui peut traîner de l'accord précédent
      const fit = fitNotes(base.concat([noteAtom(tr.note, a4)]), o);
      const gain = f0.rel - fit.rel, w = fit.a[fit.a.length - 1];
      const share = w / Math.max(1e-12, Math.max(...fit.a));
      if (gain > 0.035 && share > 0.25) foreign.push(Object.assign({ gain: +gain.toFixed(3), share: +share.toFixed(2) }, tr));
    }
    foreign.sort((p, q) => q.gain - p.gain);
    // une même corde : ne garder que l'explication la plus nette
    const seen = new Set(), fr = foreign.filter(e => { if (seen.has(e.s)) return false; seen.add(e.s); return true; });
    // notes uniques (pas d'octave dans l'accord, pas d'harmonique d'une autre corde) dont le poids est très faible
    const missing = [];
    const amax = Math.max(...f0.a);
    idx.forEach((s, k) => {
      const n = notes[s];
      const dup = notes.some((m, j) => m != null && j !== s && (m % 12 === n % 12));
      const harm = notes.some((m, j) => m != null && j !== s && [12, 19, 24, 28].includes(n - m));
      if (!dup && !harm && f0.a[k] < 0.12 * amax) missing.push({ s, note: n });
    });
    // l'explication la plus nette d'abord ; une seconde seulement si elle est presque aussi nette
    const keep = fr.length > 1 && fr[1].gain >= 0.8 * fr[0].gain ? fr.slice(0, 2) : fr.slice(0, 1);
    return { foreign: keep.filter(e => e.gain >= 0.06 && e.share >= 0.4), missing, fit: +(1 - f0.rel).toFixed(3) };
  };

  /* ---------------------------------------------------------------- caractéristiques d'un coup */
  /** Montée (dB) de l'énergie 70–1500 Hz juste après t (0–30 ms) par rapport à juste avant (−35 à −5 ms). */
  D.lowRise = function (xb, t) {
    const a = Math.round((t - 0.035) * FS), m = Math.round((t - 0.005) * FS), b = Math.round((t + 0.03) * FS);
    if (a < 0 || b > xb.length) return NaN;
    const seg = xb.subarray(a, b), lp = biquad(biquad(seg, FS, 'lp', 1500), FS, 'lp', 1500);
    let e1 = 0, e2 = 0;
    for (let i = 0; i < m - a; i++) e1 += lp[i] * lp[i];
    for (let i = m - a + Math.round(0.005 * FS); i < lp.length; i++) e2 += lp[i] * lp[i];
    return dB(e2 / (b - m - Math.round(0.005 * FS))) - dB(e1 / (m - a));
  };
  /**
   * Frappe étouffée (« chuck ») ou accord qui sonne ? Une frappe est un bruit bref : l'énergie s'effondre
   * en quelques dizaines de ms et le spectre reste plat (pas de pics de notes).
   * @returns {decay (dB, 45–90 ms vs 0–30 ms), flat (planéité 80 Hz–2 kHz), chuck: probabilité 0–1}
   */
  D.chuckFeatures = function (x, env1ms, t, nextT) {
    const i0 = Math.round(t * 1000), lim = isNum(nextT) ? Math.round(nextT * 1000) - 3 : i0 + 120;
    let e1 = 0, e2 = 0, n1 = 0, n2 = 0;
    for (let i = i0; i < Math.min(i0 + 30, env1ms.length); i++) { e1 += env1ms[i]; n1++; }
    for (let i = i0 + 45; i < Math.min(i0 + 90, lim, env1ms.length); i++) { e2 += env1ms[i]; n2++; }
    const decay = n2 >= 10 && n1 ? dB(e2 / n2) - dB(e1 / n1) : NaN;
    // planéité spectrale (géométrique / arithmétique) dans 80 Hz–2 kHz, sur 50 ms après l'attaque
    const a = Math.round((t + 0.008) * FS), len = 1024;
    let flat = NaN;
    if (a + len < x.length) {
      const m = magSpectrum(x, a, len, 2048), df = FS / 2048;
      let lg = 0, ar = 0, n = 0;
      for (let k = Math.round(80 / df); k <= Math.round(2000 / df); k++) { const p = m[k] * m[k] + 1e-12; lg += Math.log(p); ar += p; n++; }
      flat = Math.exp(lg / n) / (ar / n);
    }
    let z = 0;
    if (isNum(decay)) z += (-decay - 8) / 3;            // chute de plus de 8 dB en 45 ms : percussif
    if (isNum(flat)) z += (flat - 0.12) / 0.08;
    const p = 1 / (1 + Math.exp(-z));
    return { decay, flat, chuck: p };
  };

  /* ---------------------------------------------------------------- rythme */
  /**
   * Appariement des coups joués aux coups attendus (le plus proche d'abord, chacun une fois).
   * expected : [{t (s, dans la prise), k, i}] ; onsets : [{t}] ; win (s).
   * Dans les mesures sans clic (`free`), la grille suit le tempo réellement joué.
   */
  D.matchGrid = function (expected, onsets, win, o) {
    o = o || {};
    const pairs = [];
    const used = new Set(), done = new Set(), out = expected.map(() => null);
    // passe 1 : mesures avec clic (grille fixe)
    const fixed = expected.map((e, i) => ({ e, i })).filter(z => !z.e.free);
    for (const { e, i } of fixed) for (let j = 0; j < onsets.length; j++) { const d = onsets[j].t - e.t; if (Math.abs(d) <= win) pairs.push({ i, j, d }); }
    pairs.sort((a, b) => Math.abs(a.d) - Math.abs(b.d));
    for (const p of pairs) { if (done.has(p.i) || used.has(p.j)) continue; done.add(p.i); used.add(p.j); out[p.i] = { j: p.j, d: p.d }; }
    // passe 2 : mesures silencieuses (grille glissante : on suit la pulsation jouée)
    let lastI = -1, period = o.slot || 0.25, offset = 0;
    for (let i = 0; i < expected.length; i++) {
      const e = expected[i];
      if (!e.free) { if (out[i]) { offset = out[i].d; lastI = i; } continue; }
      const pred = e.t + offset;
      let bj = -1, bd = Infinity;
      for (let j = 0; j < onsets.length; j++) { if (used.has(j)) continue; const d = onsets[j].t - pred; if (Math.abs(d) <= win * 1.3 && Math.abs(d) < Math.abs(bd)) { bd = d; bj = j; } }
      if (bj >= 0) { used.add(bj); out[i] = { j: bj, d: onsets[bj].t - e.t, drift: true }; offset = 0.6 * offset + 0.4 * (onsets[bj].t - e.t); lastI = i; }
    }
    void lastI; void period;
    const extras = [];
    onsets.forEach((on, j) => { if (!used.has(j)) extras.push(j); });
    return { match: out, extras };
  };
  /**
   * Analyse d'une prise rythmée (pulsation, rythmique, changements en rythme, arpèges, chanson).
   * spec : {clicks:[t], cleanClicks, latency (a priori, s), events:[{t, k, chord, free, bar}],
   *         slot (s), tol (ms), segments:[{t0, t1, v}], vocab:[voicing], a4, minDelta}
   */
  D.analyzeRhythm = function (pcm, sr, spec) {
    const prep = D.prepare(pcm, sr), x = prep.x, lv = D.levels(x);
    const issues = D.issues(prep, lv);
    const res = { ok: !issues.includes('silence'), issues, snr: +lv.snr.toFixed(1), level: +lv.playDb.toFixed(1) };
    // latence : clics du décompte d'abord, sinon tous les clics, sinon l'a priori
    let lat = null;
    if (spec.clicks && spec.clicks.length) {
      const clean = spec.clicks.slice(0, spec.cleanClicks || 0);
      lat = clean.length >= 2 ? D.measureLatency(x, clean) : null;
      if (!lat) lat = D.measureLatency(x, spec.clicks);
    }
    res.latency = lat ? lat.latency : (isNum(spec.latency) ? spec.latency : 0.1);
    res.latencySrc = lat ? 'mesurée' : 'estimée';
    if (!res.ok) return res;
    const on = D.onsets(x, { minDelta: spec.minDelta, rel: spec.rel, combine: spec.combine });
    const L = res.latency;
    const exp = spec.events.map((e, i) => ({ t: e.t + L, k: e.k, i, free: !!e.free, chord: e.chord, bar: e.bar }));
    const t0 = exp.length ? exp[0].t - Math.max(0.12, (spec.slot || 0.25)) : 0;
    const t1 = exp.length ? exp[exp.length - 1].t + Math.max(0.25, 2 * (spec.slot || 0.25)) : Infinity;
    const ons = on.list.filter(o => o.t >= t0 && o.t <= t1);
    const win = Math.min(0.45 * (spec.slot || 0.25), 0.14);
    const g = D.matchGrid(exp, ons, win, { slot: spec.slot });
    const clickAt = (spec.clicks || []).map(c => c + L), vBlind = median(ons.map(o => o.v));
    // un clic du métronome qui déborde dans la bande d'analyse n'apporte pas d'énergie grave nouvelle, un coup si
    const clickOnly = o2 => clickAt.some(c => Math.abs(c - o2.t) < 0.015) && !(D.lowRise(on.xb, o2.t) > 2);
    // coups attendus non trouvés : recherche guidée autour de l'instant attendu (ou prévu par la dérive) — un coup
    // léger mais réel, pas un clic ni un reste de résonance
    exp.forEach((e, i) => {
      if (g.match[i]) return;
      let pred = e.t;
      if (e.free) { const prev = g.match.slice(0, i).reverse().find(Boolean); if (prev) pred += prev.d; }
      const go = D.guidedOnset(on, pred, win);
      if (!go || ons.some(o3 => Math.abs(o3.t - go.t) < 0.04)) return;
      if (go.v < 0.3 * (vBlind || 0) || clickOnly(go)) return;
      ons.push(go);
      g.match[i] = { j: ons.length - 1, d: go.t - e.t, drift: e.free };
    });
    res.events = exp.map((e, i) => {
      const m = g.match[i];
      if (!m) return { i, k: e.k, t: e.t - L, hit: false, free: e.free };
      const o2 = ons[m.j], next = ons.filter(z => z.t > o2.t + 0.03)[0];
      const ch = D.chuckFeatures(on.xb, on.env, o2.t, next ? next.t : null);
      return { i, k: e.k, t: e.t - L, hit: true, err: +(1000 * m.d).toFixed(1), free: e.free, drift: !!m.drift, lvl: o2.lvl, v: o2.v, chuck: +ch.chuck.toFixed(2) };
    });
    // coups en trop : attaques franches (≥ 30 % de la force médiane des coups joués) non appariées
    const vMed = median(res.events.filter(e => e.hit).map(e => e.v));
    res.extras = g.extras.map(j => ons[j]).filter(o2 => o2.v >= 0.3 * (vMed || 0) && !clickOnly(o2)).map(o2 => ({ t: o2.t - L, lvl: o2.lvl }));
    const hits = res.events.filter(e => e.hit);
    const clicked = hits.filter(e => !e.free);
    res.hitRate = exp.length ? hits.length / exp.length : 0;
    res.mean = clicked.length ? mean(clicked.map(e => e.err)) : NaN;
    res.sd = clicked.length > 2 ? std(clicked.map(e => e.err)) : NaN;
    res.mae = clicked.length ? mean(clicked.map(e => Math.abs(e.err))) : NaN;
    // frappes étouffées attendues (X) : reconnues comme percussives ? coups normaux pris pour des frappes ?
    const xs = hits.filter(e => e.k === 'X'), ds = hits.filter(e => e.k === 'D' || e.k === 'U');
    res.chuckOk = xs.length ? xs.filter(e => e.chuck >= 0.5).length / xs.length : null;
    res.chuckFalse = xs.length && ds.length ? ds.filter(e => e.chuck >= 0.5).length / ds.length : null;
    // mesures sans clic : tempo réellement tenu et dérive
    const fr = hits.filter(e => e.free);
    if (fr.length >= 4) {
      const xsF = fr.map(e => e.t), ysF = fr.map(e => e.err / 1000);
      const mx = mean(xsF), my = mean(ysF);
      let sxy = 0, sxx = 0; xsF.forEach((v, i) => { sxy += (v - mx) * (ysF[i] - my); sxx += (v - mx) * (v - mx); });
      const slope = sxx > 0 ? sxy / sxx : 0;              // s de retard par s : <0 = on accélère
      res.drift = { slope, tempoRatio: 1 / (1 + slope), endErr: fr[fr.length - 1].err, n: fr.length, ioiSd: NaN };
      const iois = []; for (let i = 1; i < fr.length; i++) { const de = fr[i].t - fr[i - 1].t; if (de > 0) iois.push((fr[i].err - fr[i - 1].err)); }
      res.drift.ioiSd = iois.length > 2 ? std(iois) : NaN;
    }
    // accords par segment (mesure) : spectre moyen hors attaques, comparé aux accords attendus de l'exercice
    if (spec.segments && spec.segments.length) {
      const obsList = spec.segments.map(sg => D.observe(x, (sg.t0 + L + 0.04) * FS, (sg.t1 + L - 0.01) * FS, { a4: spec.a4 }));
      const ids = Array.from(new Set(spec.segments.map(sg => sg.v).concat((spec.vocab || []).map(v => v.id || v)))).filter(id => T.voicing(id));
      const judgeAt = cp => {
        const cand = ids.map(id => T.withCapo(T.voicing(id), cp));
        const out = spec.segments.map((sg, i) => {
          const v = T.withCapo(T.voicing(sg.v), cp), obs = obsList[i];
          if (!obs || !v) return { v: sg.v, ok: null };
          const m = D.identify(obs, cand, spec.a4), sv = m.sim[v.id];
          return { v: sg.v, ok: m.best === v.id || sv >= m.score - 0.01, sim: sv, heard: m.best, obs, voicing: v };
        });
        const done = out.filter(c => c.ok != null);
        return { cp, out, okRate: done.length ? done.filter(c => c.ok).length / done.length : 0, mean: done.length ? mean(done.map(c => c.sim)) : 0 };
      };
      let best = judgeAt(spec.capo || 0);
      // capo oublié (ou mis sans le dire) : si presque rien ne correspond, on essaie les cases 0 à 7 ; une case qui
      // explique nettement mieux le son est retenue et signalée
      if (best.okRate < 0.6 && obsList.filter(Boolean).length >= 2) {
        let alt = null;
        for (let k = 0; k <= 7; k++) { if (k === (spec.capo || 0)) continue; const e = judgeAt(k); if (e.okRate >= 0.75 && e.mean > best.mean + 0.1 && (!alt || e.mean > alt.mean)) alt = e; }
        if (alt) { best = alt; res.capoHeard = alt.cp; }
      }
      res.chords = best.out.map(c => {
        if (c.ok == null) return c;
        const dg = D.chordDiagnosis(c.obs, c.voicing, spec.a4);
        return { v: c.v, ok: c.ok, sim: c.sim, heard: c.heard, foreign: dg.foreign, missing: dg.missing };
      });
    }
    return res;
  };

  /* ---------------------------------------------------------------- changements libres (minute) */
  /**
   * Changements en une minute : chaque coup doit être l'accord suivant de l'alternance A, B, A, B…
   * spec : {a, b (ids de formes), t0, t1 (s, fenêtre utile), a4}
   * @returns {strums:[{t, chord: 'a'|'b'|null, sim}], changes (propres), cpm, unclear, repeats}
   */
  D.analyzeChanges = function (pcm, sr, spec) {
    const prep = D.prepare(pcm, sr), x = prep.x, lv = D.levels(x);
    const issues = D.issues(prep, lv);
    const res = { ok: !issues.includes('silence'), issues, snr: +lv.snr.toFixed(1) };
    if (!res.ok) return Object.assign(res, { strums: [], changes: 0, cpm: 0 });
    const on = D.onsets(x, { hop: 0.008, combine: 0.12 });
    const ons = on.list.filter(o => o.t >= (spec.t0 || 0) && o.t <= (spec.t1 || Infinity));
    const vMed = median(ons.map(o => o.v));
    const kept = ons.filter(o => o.v >= 0.25 * vMed);
    const obsList = kept.map((o, i) => { const next = kept[i + 1]; return D.observe(x, (o.t + 0.04) * FS, Math.min(((next ? next.t : o.t + 0.6) - 0.01), o.t + 0.7) * FS, { a4: spec.a4 }); });
    const strumsAt = cp => {
      const va = T.withCapo(T.voicing(spec.a), cp), vb = T.withCapo(T.voicing(spec.b), cp);
      return kept.map((o, i) => {
        const obs = obsList[i];
        if (!obs) return { t: o.t, chord: null };
        const m = D.identify(obs, [va, vb], spec.a4);
        const sa = m.sim[va.id], sb = m.sim[vb.id];
        return { t: o.t, chord: Math.max(sa, sb) >= 0.6 && m.margin >= 0.02 ? (sa > sb ? 'a' : 'b') : null, sa, sb, sim: Math.max(sa, sb), obs, va, vb };
      });
    };
    let strums = strumsAt(spec.capo || 0);
    // capo oublié : presque aucun coup reconnu → on essaie les cases 0 à 7
    const known = list => list.filter(z => z.chord).length;
    if (strums.length >= 4 && known(strums) < 0.5 * strums.length) {
      let alt = null;
      for (let k = 0; k <= 7; k++) { if (k === (spec.capo || 0)) continue; const e = strumsAt(k); if (known(e) >= 0.75 * e.length && (!alt || known(e) > known(alt))) alt = e; }
      if (alt) { strums = alt; res.capoHeard = alt[0].va.capo || 0; }
    }
    res.strums = strums.map(z => {
      if (!z.chord) return { t: z.t, chord: null, sa: z.sa, sb: z.sb, sim: z.sim, foreign: [], missing: [] };
      // accord reconnu mais pas propre : corde à vide au lieu d'une case, case voisine, note unique absente
      const v = z.chord === 'a' ? z.va : z.vb, other = z.chord === 'a' ? z.vb : z.va;
      const dg = D.chordDiagnosis(z.obs, v, spec.a4, T.voicingNotes(other).filter(n => n != null));
      return { t: z.t, chord: z.chord, sa: z.sa, sb: z.sb, sim: z.sim, foreign: dg.foreign, missing: dg.missing };
    });
    // une note étrangère nette (corde à vide au lieu d'une case, case voisine) : le changement ne compte pas ;
    // une note unique absente est signalée (indice plus faible) sans retirer le changement
    res.strums.forEach(z => { z.clean = !!z.chord && !z.foreign.length; });
    // compte : un changement propre = un coup reconnu, propre, dont l'accord diffère du dernier coup reconnu
    let last = null, changes = 0, unclear = 0, repeats = 0, flawed = 0;
    for (const s of res.strums) {
      if (!s.chord) { unclear++; continue; }
      if (!s.clean) { flawed++; last = s.chord; continue; }
      if (last && s.chord !== last) changes++;
      else if (last && s.chord === last) repeats++;
      last = s.chord;
    }
    res.flawed = flawed;
    const dur = Math.max(1, (spec.t1 || x.length / FS) - (spec.t0 || 0));
    Object.assign(res, { changes, unclear, repeats, cpm: changes * 60 / dur, dur });
    return res;
  };

  /* ---------------------------------------------------------------- accords de mémoire (chrono) */
  /**
   * spec : {cues:[{t, v, limit}], latency, vocab:[voicing], a4} — pour chaque signal, premier coup franc
   * après le signal : bon accord ? en combien de temps ?
   */
  D.analyzeCues = function (pcm, sr, spec) {
    const prep = D.prepare(pcm, sr), x = prep.x, lv = D.levels(x);
    const issues = D.issues(prep, lv);
    const res = { ok: !issues.includes('silence'), issues, snr: +lv.snr.toFixed(1) };
    if (!res.ok) return res;
    const L = isNum(spec.latency) ? spec.latency : 0.1;
    let lat = spec.clicks ? D.measureLatency(x, spec.clicks) : null;
    const lt = lat ? lat.latency : L;
    const on = D.onsets(x, { hop: 0.006, combine: 0.1 });
    res.cues = spec.cues.map((c, ci) => {
      const t = c.t + lt, nextCue = spec.cues[ci + 1] ? spec.cues[ci + 1].t + lt : x.length / FS;
      const o = on.list.find(z => z.t > t + 0.12 && z.t < Math.min(nextCue, t + c.limit + 1.2));
      if (!o) return { v: c.v, hit: false };
      const after = on.list.find(z => z.t > o.t + 0.08);
      const obs = D.observe(x, (o.t + 0.04) * FS, Math.min((after ? after.t : o.t + 0.7) - 0.01, o.t + 0.7) * FS, { a4: spec.a4 });

        const kinds = {}; miss.forEach(e => { kinds[e.k] = (kinds[e.k] || 0) + 1; });
        const what = Object.entries(kinds).map(([k, c]) => c + ' coup' + (c > 1 ? 's' : '') + ' ' + ({ D: 'vers le bas', U: 'vers le haut', X: 'percussif' }[k] || '')).join(', ');
        fb.push({ kind: 'bad', text: miss.length + '/' + n + ' coups manqués (' + what + ').' });
      }
      if (ex.length) {
        const beatDur = 60 / score.tempo, slotDur = beatDur / score.sub;
        const onRest = ex.filter(x => { const rel = (x.t - (o.t0 || 0)) / slotDur; const slot = ((Math.round(rel) % (score.sig * score.sub)) + score.sig * score.sub) % (score.sig * score.sub); return score.strum && T.strum(score.strum).slots[slot] === '.'; }).length;
        fb.push({ kind: 'bad', text: ex.length + ' coup' + (ex.length > 1 ? 's' : '') + ' en trop' + (onRest ? ' — dont ' + onRest + ' sur une case « silence » : la main passe sans toucher les cordes' : '') + '.' });
      }
    }
    if (isFinite(res.mean) && Math.abs(res.mean) > tol * 0.6) fb.push({ kind: 'warn', text: (res.mean < 0 ? 'En avance' : 'En retard') + ' de ' + f0(Math.abs(res.mean)) + ' ms en moyenne : ' + (res.mean < 0 ? 'laisse venir le clic, ne le devance pas.' : 'pars avec le clic, pas après lui.') });
    else if (isFinite(res.mae)) fb.push({ kind: res.mae <= tol ? 'good' : 'warn', text: 'Écart moyen au clic : ' + f0(res.mae) + ' ms (objectif ≤ ' + tol + ')' });
    if (isFinite(res.sd) && res.sd > tol) fb.push({ kind: 'tip', text: 'Régularité : ±' + f0(res.sd) + ' ms. Garde le bras en mouvement continu, comme un balancier : bas sur les temps, haut sur les « et ».' });
    if (res.chuckOk != null && res.chuckOk < 0.75) fb.push({ kind: 'tip', text: 'Les frappes (✕) sonnent encore comme des accords : pose le tranchant de la main (ou les doigts à plat) sur les cordes en même temps que tu frappes — un « tchack » sec, sans note.' });
    return fb;
  }
  C.rhythmFeedback = rhythmFeedback;

  /* ---------------------------------------------------------------- choix des paramètres */
  /** Parmi des candidats, celui dont la difficulté est la plus proche de la cible (avec un peu de variété). */
  C.choose = function (ex, target, ctx, r) {
    const cands = ex.candidates(ctx, r || Math.random);
    let best = null, bd = Infinity;
    const scored = cands.map(p => ({ p, d: ex.difficulty(p, ctx) })).filter(o => isFinite(o.d));
    for (const o of scored) { const e = Math.abs(o.d - target); if (e < bd) { bd = e; best = o; } }
    if (!best) return null;
    const near = scored.filter(o => Math.abs(o.d - target) <= bd + 0.3);
    const o = near.length ? near[Math.floor((r || Math.random)() * near.length) % near.length] : best;
    return { params: o.p, d: o.d };
  };

  /** Accords connus (vocabulaire) jouables dans le contexte (sans barrés tant qu'ils ne sont pas abordés). */
  function vocab(ctx, o) {
    o = o || {};
    let v = (ctx.vocab || []).filter(id => T.voicing(id));
    if (!o.barres && !o.onlyBarres) v = v.filter(id => !C.isBarreId(id));
    // « barrés » : les vrais barrés, et les petits barrés qui y préparent (Fa sur 4 cordes, Ré m7, La 6)
    if (o.onlyBarres) v = v.filter(id => C.isBarreId(id) || !!(T.voicing(id).barre));
    return v;
  }
  C.vocab = vocab;
  /** Paires candidates : celles de la chanson travaillée d'abord, puis les plus faibles, puis au hasard. */
  function pairs(ctx, r, o) {
    o = o || {};
    if (ctx.focusPair) return [ctx.focusPair];
    const vs = vocab(ctx, o), out = [];
    const add = (a, b) => { if (a && b && a !== b && vs.includes(a) && vs.includes(b) && !out.some(p => T.pairKey(p[0], p[1]) === T.pairKey(a, b))) out.push([a, b]); };
    (ctx.songPairs || []).forEach(p => add(p[0], p[1]));
    const all = [];
    for (let i = 0; i < vs.length; i++) for (let j = i + 1; j < vs.length; j++) all.push([vs[i], vs[j]]);
    // les paires les moins sûres d'abord (record bas ou jamais travaillées), un peu de hasard
    const stat = p => (ctx.pairStat ? ctx.pairStat(p[0], p[1]) : null);
    all.sort((x, y) => { const sx = stat(x), sy = stat(y); return ((sx ? sx.best : 0) - (sy ? sy.best : 0)) + (r() - 0.5) * 20; });
    all.slice(0, o.max || 10).forEach(p => add(p[0], p[1]));
    if (o.onlyBarres) return out.filter(p => T.voicing(p[0]).barre || T.voicing(p[1]).barre);
    return out;
  }
  C.pairs = pairs;

  /**
   * Spécification d'analyse d'une prise rythmée, partagée par l'app et les tests.
   * sc : partition (rhythmScore) ; start : instant (s, depuis le 1er échantillon enregistré) du 1er temps après le
   * décompte ; clicks : instants des clics programmés (même origine) ; latency : latence a priori (s).
   */
  C.rhythmSpec = function (sc, start, clicks, latency) {
    const beat = 60 / sc.tempo;
    return {
      clicks, cleanClicks: sc.countIn, latency, capo: sc.capo || 0,
      events: sc.events.map(e => ({ t: start + e.beat * beat, k: e.k, chord: e.v, free: !sc.clickBars[Math.floor(e.beat / sc.sig)] })),
      slot: beat / sc.sub,
      segments: sc.segments.map(g => ({ t0: start + g.beat0 * beat, t1: start + g.beat1 * beat, v: g.v })),
      vocab: Array.from(new Set(sc.seq)).map(id => T.voicing(id)),
    };
  };

  /* ================================================================ EXERCICES */
  const EX = [];

  /* -------------------------------------------------- main gauche */
  function propreFactory(id, comp, onlyBarres) {
    return {
      id, comp, also: comp === 'barres' ? { accords: 0.3 } : {}, kind: 'play', load: comp === 'barres' ? 1.4 : 0.8, pillar: 'gauche',
      name: comp === 'barres' ? 'Barré propre, corde par corde' : 'Accord propre, corde par corde',
      why: comp === 'barres'
        ? 'Un barré qui sonne, c’est d’abord un index qui appuie juste assez au bon endroit. On vérifie chaque corde une à une : le micro dit laquelle reste muette ou sonne faux.'
        : 'La base de tout accompagnement : chaque corde de l’accord doit sonner. Le micro écoute chaque corde une à une et te dit précisément laquelle est étouffée ou fausse.',
      how: ['Forme l’accord et garde-le.', 'Joue une corde à la fois, de la plus grave à la plus aiguë (seulement les cordes de l’accord), en laissant sonner.', 'Écoute chaque note : elle doit sonner comme une cloche, sans « toc ».'],
      cue: 'Fais sonner chaque corde comme une petite cloche : un son long et clair, pas un « toc » étouffé.',
      candidates(ctx) {
        let vs = onlyBarres ? vocab(ctx, { onlyBarres: true }) : vocab(ctx);
        // accords appris récemment et pas encore propres : on y revient en priorité (rappel espacé)
        const fresh = (ctx.freshChords || []).filter(id => vs.includes(id));
        if (fresh.length && !((ctx.takeIndex || 0) % 2)) vs = fresh;         // une prise sur deux, au plus
        const extra = ctx.newChord && (onlyBarres ? !!T.voicing(ctx.newChord).barre : !C.isBarreId(ctx.newChord)) ? [ctx.newChord] : [];
        return Array.from(new Set(vs.concat(extra))).map(v => ({ v }));
      },
      difficulty(p) { const v = T.voicing(p.v); return v ? 0.85 * v.d + 0.3 : NaN; },
      label: p => vName(p.v),
      steps(p) {
        const v = T.voicing(p.v), n = T.sounding(v).length;
        return [
          { t: 'show', v: [p.v], label: 'Forme ' + vName(p.v), sub: 'Pose les doigts, puis touche « Prêt ».' },
          { t: 'listen', play: { kind: 'arp', v: p.v, gap: 0.55 }, label: 'Écoute : chaque corde, de la plus grave à la plus aiguë' },
          { t: 'play', label: 'Joue les ' + n + ' cordes, une par une', sub: 'De la ' + STR(T.sounding(v)[0]) + ' à la ' + STR(T.sounding(v)[n - 1]) + '. Prends ton temps.', rec: { kind: 'plucks', v: p.v }, sec: Math.min(14, 3 + n * 1.3), stopOnSilence: true, show: [p.v] },
        ];
      },
      judge(res, p) {
        const fb = recordingIssues(res);
        if (!res || !res.ok || !res.strings || !res.strings.length) return { y: null, success: null, fb };
        const v = T.voicing(p.v), bad = res.strings.filter(s => s.status !== 'ok');
        const y = !bad.length ? 1 : bad.length === 1 ? 0.5 : 0;
        if (!bad.length) fb.push({ kind: 'good', text: 'Les ' + res.strings.length + ' cordes sonnent ✓' });
        for (const s of bad.slice(0, 3)) {
          const fg = v.fingers[s.s], fret = v.frets[s.s];
          if (s.status === 'muted') fb.push({ kind: 'bad', text: 'La ' + STR(s.s) + ' est étouffée.' + (fret > 0 ? ' Doigt ' + fg + ' : bien sur le bout, juste derrière la frette.' : ' Un doigt voisin la touche : cambre-le pour la laisser passer dessous.') });
          else if (s.status === 'wrong') fb.push({ kind: 'bad', text: 'Sur la ' + STR(s.s) + ', j’entends ' + T.noteName(s.got) + ' au lieu de ' + T.noteName(s.exp) + (fret > 0 ? ' : vérifie la case du doigt ' + fg + '.' : ' : cette corde doit sonner à vide.') });
          else if (s.status === 'missing') fb.push({ kind: 'warn', text: 'Je n’ai pas entendu la ' + STR(s.s) + ' (sautée ?).' });
        }
        if (bad.some(s => s.status === 'muted')) fb.push({ kind: 'tip', text: 'Astuce : pouce derrière le manche, à mi-hauteur ; poignet un peu avancé. Les doigts arrivent alors d’en haut, comme des marteaux.' });
        return { y, success: y === 1, fb, metrics: { nOk: res.nOk, n: res.strings.length }, chord: { id: p.v, clean: !bad.length, strings: res.strings.map(s => s.status) } };
      },
    };
  }
  EX.push(propreFactory('propre', 'accords', false));
  EX.push(propreFactory('barre', 'barres', true));

  EX.push({

    how: ['Un nom d’accord s’affiche avec un bip.', 'Forme-le le plus vite possible, puis gratte une fois.', 'Relâche, et attends le suivant.'],

    candidates(ctx, r) {

      const out = [];
      for (let k = 0; k < 8; k++) {

    },
    difficulty(p) { const ds = p.chords.map(id => T.voicing(id).d); return 0.55 * (ds.reduce((a, b) => a + b, 0) / ds.length) + 0.25 * Math.max(...ds) + 2.4 * Math.log2(4.5 / p.limit) - 0.2; },

      const rts = res.cues.filter(c => c.hit && c.ok).map(c => c.rt);
      if (rts.length) fb.push({ kind: 'info', text: 'Temps de formation : ' + rts.map(t => fr1(t) + ' s').join(' · ') });
      res.cues.forEach(c => {

        else if (!c.ok) fb.push({ kind: 'bad', text: vSym(c.v) + ' : j’ai entendu ' + (c.heard ? vSym(c.heard) : 'un autre accord') + '.' + (c.foreign && c.foreign[0] ? ' ' + foreignText(c.foreign[0], T.voicing(c.v)) : '') });
        else if (!c.inTime) fb.push({ kind: 'warn', text: vSym(c.v) + ' : juste, mais en ' + fr1(c.rt) + ' s (limite ' + fr1(p.limit) + ' s).' });
      });
      return { y, success: y === 1, fb, metrics: { good, n, rt: rts.length ? rts.reduce((a, b) => a + b, 0) / rts.length : null }, forms: res.cues.filter(c => c.hit && c.ok).map(c => ({ id: c.v, rt: c.rt })) };
    },
  });

  EX.push({

  /** Repère de doigté pour un changement : doigts qui restent en place (pivots) ou glissent sur leur corde. */
  function pivotText(a, b) {
    const va = T.voicing(a), vb = T.voicing(b);
    if (!va || !vb) return '';
    const same = [], slide = [];
    for (let s = 0; s < 6; s++) {
      const fa = va.fingers[s], fb = vb.fingers[s];
      if (fa && fa === fb && va.frets[s] === vb.frets[s] && va.frets[s] > 0) same.push(fa);
      else if (fa && fa === fb && va.frets[s] > 0 && vb.frets[s] > 0) slide.push(fa);
    }
    const u = arr => Array.from(new Set(arr));
    if (same.length) return 'Pivot : le doigt ' + u(same).join(' et ') + ' ne bouge pas. Les autres arrivent ensemble.';
    if (slide.length) return 'Guide : le doigt ' + u(slide).join(' et ') + ' glisse sur sa corde, sans la quitter.';
    return 'Tous les doigts changent : vise la forme entière d’un seul geste.';
  }
  C.pivotText = pivotText;

      },

  St.newState = function (ts) {
    const s = {
      v: St.VERSION, created: ts || Date.now(), onboarded: false,
      profile: St.defaultProfile(),
      program: { start: today(ts), cycle: 1, pausedDays: 0 },
      skills: {}, items: {},
      vocab: [],                                 // accords introduits (ids de formes), dans l'ordre
      chords: {}, pairs: {}, patterns: {}, picks: {}, chant: {},
      cards: {}, series: {}, calib: { n: 0, hits: 0, recent: [] },
      sessions: [], bilans: [], deadline: null,
      health: { painDays: [], soreDays: [] },
      songs: [], workSong: null, ideas: [],
    };
    M.COMPS.forEach(c => { s.skills[c.id] = M.newSkill(2, 2); });
    return s;
  };
  St.migrate = function (s) {
    if (!s || typeof s !== 'object') return St.newState();
    const base = St.newState(s.created);
    for (const k of Object.keys(base)) if (s[k] == null) s[k] = base[k];
    s.profile = Object.assign(St.defaultProfile(), s.profile || {});
    M.COMPS.forEach(c => { if (!s.skills[c.id]) s.skills[c.id] = M.newSkill(2, 2); });
    s.v = St.VERSION;
    return s;
  };
  /** Point de départ déclaré : niveaux a priori (incertains) et accords déjà connus. */
  St.applyStart = function (s, key) {
    const st = St.START_LEVELS[key] || St.START_LEVELS.debut;
    s.profile.start = key;
    for (const c of M.COMPS) s.skills[c.id] = M.newSkill(st.th[c.id], key === 'zero' ? 1.2 : 1.8);
    const AC2 = AC.catalog;
    const vocab = st.vocab == null ? (AC2 ? AC2.VOCAB_ORDER.slice(0, 32) : []) : st.vocab;
    s.vocab = vocab.slice();
    vocab.forEach(id => { if (!s.chords[id]) s.chords[id] = { intro: today(), n: 0, clean: null, form: null, declared: true }; });
  };

  /* ---------------------------------------------------------------- vocabulaire */
  St.introduce = function (s, id, ts) {
    if (!s.vocab.includes(id)) s.vocab.push(id);
    if (!s.chords[id]) s.chords[id] = { intro: today(ts), n: 0, clean: null, form: null };
  };
  /** Accord maîtrisé : propre dans au moins 2 des 3 dernières vérifications, et formé en moins de 2,5 s. */
  St.mastered = (s, id) => { const c = s.chords[id]; return !!c && c.clean != null && c.clean >= 0.66 && (c.form == null || c.form <= 2.5) && c.n >= 2; };
  St.chordUpdate = function (s, id, o, ts) {
    const c = s.chords[id] || (s.chords[id] = { intro: today(ts), n: 0, clean: null, form: null });
    if (o.clean != null) { c.clean = c.clean == null ? (o.clean ? 1 : 0) : +(0.6 * c.clean + 0.4 * (o.clean ? 1 : 0)).toFixed(3); c.n++; c.last = ts || Date.now(); }
    if (isFinite(o.rt)) { c.form = c.form == null ? +o.rt.toFixed(2) : +(0.7 * c.form + 0.3 * o.rt).toFixed(2); c.formBest = Math.min(c.formBest || 99, +o.rt.toFixed(2)); }
    if (o.strings) c.strings = o.strings;
  };

  /* ---------------------------------------------------------------- paires, rythmiques */
  St.pairStat = (s, a, b) => s.pairs[T.pairKey(a, b)] || null;
  St.pairUpdate = function (s, a, b, cpm, ts) {
    const k = T.pairKey(a, b), p = s.pairs[k] || (s.pairs[k] = { n: 0, best: 0, ema: null, hist: [] });
    p.n++; p.best = Math.max(p.best, Math.round(cpm)); p.ema = p.ema == null ? cpm : 0.6 * p.ema + 0.4 * cpm; p.ema = +p.ema.toFixed(1); p.last = ts || Date.now();
    const d = today(ts), h = p.hist, l = h[h.length - 1];
    if (l && l[0] === d) l[1] = Math.max(l[1], Math.round(cpm)); else h.push([d, Math.round(cpm)]);
    if (h.length > 120) h.splice(0, h.length - 120);
  };
  St.pairRhythm = function (s, a, b, tempo, bpc, ts) {
    const k = T.pairKey(a, b), p = s.pairs[k] || (s.pairs[k] = { n: 0, best: 0, ema: null, hist: [] });
    const rate = tempo / bpc;
    if (!p.rhythm || rate > p.rhythm.rate) p.rhythm = { tempo, bpc, rate, day: today(ts) };
  };
  St.patternUpdate = function (s, table, id, tempo, mae, ts) {
    const p = s[table][id] || (s[table][id] = { n: 0, best: 0, mae: null });
    p.n++; if (tempo > p.best) p.best = tempo; p.last = ts || Date.now();
    if (isFinite(mae)) p.mae = p.mae == null ? mae : +(0.7 * p.mae + 0.3 * mae).toFixed(1);
  };

  /* ---------------------------------------------------------------- séries */
  St.addSeries = function (s, key, value, ts, mode) {
    if (!isFinite(value)) return;
    const arr = s.series[key] = s.series[key] || [];
    const d = today(ts), last = arr[arr.length - 1];
    if (last && last[0] === d) last[1] = mode === 'min' ? Math.min(last[1], +value.toFixed(2)) : mode === 'max' ? Math.max(last[1], +value.toFixed(2)) : +value.toFixed(2);
    else arr.push([d, +value.toFixed(2)]);
    if (arr.length > 500) arr.splice(0, arr.length - 500);
  };

  /* ---------------------------------------------------------------- chansons */
  /**
   * Fiche de chanson à partir du texte collé : grille lue, capo le plus confortable, formes à jouer.
   * o : {title, artist, tempo, strum, bpc, capo (forcé), transpose}
   */
  St.makeSong = function (text, o) {
    o = o || {};
    const parsed = T.parseSong(text);
    const song = {
      id: 's' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36),
      title: o.title || parsed.title || 'Ma chanson', artist: o.artist || parsed.artist || '',
      text: String(text || ''), tempo: o.tempo || parsed.tempo || 90, strum: o.strum || 'r4', bpc: o.bpc || 4,
      transpose: o.transpose || 0, capo: o.capo != null ? o.capo : parsed.capo, created: Date.now(), prefs: {},
      lyrics: '',
    };
    const firstLyric = parsed.sections.flatMap(sx => sx.lines).find(l => l.lyrics);
    if (firstLyric) song.lyrics = firstLyric.lyrics.slice(0, 90);
    return song;
  };
  /**
   * Analyse d'une chanson pour l'entraînement : symboles réels (transposés), capo retenu, formes jouées,
   * sections en mesures, paires de changements, tonalité.
   */
  St.songInfo = function (song) {
    const parsed = T.parseSong(song.text);
    // les accords écrits sous « Capo N » sont des formes : le son réel est N demi-tons plus haut
    const tr = (song.transpose || 0) + (parsed.capo || 0);
    const real = sym => (tr ? T.transposeSym(sym, tr) : sym);
    const seqReal = parsed.seq.map(real);
    if (!seqReal.length) return { ok: false, warnings: parsed.warnings, parsed };
    const opts = T.capoOptions(seqReal);
    let capo = song.capo != null ? song.capo : opts.length ? opts[0].capo : 0;
    const shapeOf = sym => T.transposeSym(sym, -capo);
    const voicingOf = sym => { const sh = shapeOf(sym); const pl = T.playable(sh, song.prefs); return pl ? pl.v.id : null; };
    const sections = parsed.sections.map(sx => {
      const bars = [];
      for (const l of sx.lines) {
        if (l.bars && l.bars.length) l.bars.forEach(b => { const ids = b.filter(c => c !== '/' && c !== '%').map(c => voicingOf(real(c))).filter(Boolean); if (ids.length) bars.push(ids); else if (b[0] === '%' && bars.length) bars.push(bars[bars.length - 1].slice()); });
        else l.chords.forEach(c => { const id = voicingOf(real(c)); if (id) bars.push([id]); });
      }
      return { name: sx.name, bars, lines: sx.lines.map(l => ({ chords: l.chords.map(real), lyrics: l.lyrics, bars: l.bars ? l.bars.map(b => b.map(c => (c === '/' || c === '%' ? c : real(c)))) : null })) };
    }).filter(sx => sx.bars.length || sx.lines.length);
    const seqV = seqReal.map(voicingOf).filter(Boolean);
    const trans = T.transitionsOf(seqV);
    const key = T.detectKey(seqReal);
    const simplified = Array.from(new Set(seqReal.map(shapeOf))).map(sh => ({ sh, p: T.playable(sh, song.prefs) })).filter(x => x.p && x.p.simplified).map(x => ({ shape: x.sh, as: x.p.as }));
    const uniq = Array.from(new Set(seqV));
    const maxCost = trans.length ? Math.max(...trans.map(t => T.transitionCost(t.a, t.b))) : 0;
    const pat = T.strum(song.strum) || T.strum('r3');
    const diff = Math.max(...uniq.map(id => T.voicing(id).d), T.strumCost(pat) + 0.5, 0.35 * maxCost + 1.5);
    return { ok: true, parsed, capo, capoOptions: opts.slice(0, 4), sections, seq: seqV, uniq, transitions: trans, key, simplified, diff: +diff.toFixed(2), realChords: Array.from(new Set(seqReal)) };
  };
  /**
   * « Prête à jouer » : pour chaque changement, ton record de changements/min face à celui qu'exige la chanson
   * (tempo ÷ temps par accord, avec 30 % de marge) ; propreté des accords ; rythmique au tempo ; chant.
   * @returns {score (0–1), parts:{chords, changes, strum, chant}, bottleneck, details}
   */
  St.readiness = function (s, song, info) {
    info = info || St.songInfo(song);
    if (!info.ok) return null;
    const need = T.requiredCpm(song.tempo, song.bpc) * 1.3;
    const ch = info.transitions.map(t => {
      const p = St.pairStat(s, t.a, t.b);
      const best = p ? p.best : 0;
      return { a: t.a, b: t.b, n: t.n, best, need: Math.round(need), ratio: Math.min(1, best / need), rhythm: p && p.rhythm ? p.rhythm : null };
    }).sort((x, y) => x.ratio - y.ratio);
    const weakest = ch.slice(0, 2);
    const changes = ch.length ? weakest.reduce((a, b) => a + b.ratio, 0) / weakest.length * 0.6 + ch.reduce((a, b) => a + b.ratio, 0) / ch.length * 0.4 : 1;
    const chords = info.uniq.map(id => { const c = s.chords[id]; return { id, known: !!c, clean: c && c.clean != null ? c.clean : 0 }; });
    const chordsScore = chords.length ? chords.reduce((a, c) => a + (c.known ? Math.max(0.3, c.clean) : 0), 0) / chords.length : 0;
    const ps = s.patterns[song.strum];
    const strum = ps ? Math.min(1, ps.best / song.tempo) : 0;
    const cs = s.chant[song.strum];
    const chant = cs ? Math.min(1, cs.best / song.tempo) : 0;
    // sections jouées en entier dans « Ma chanson » : part du tempo réel tenue (rythmique simplifiée : ×0,7)
    const prog = song.progress || {};
    const secs = info.sections.map((sx, i) => Math.min(1, prog[i] || 0));
    const sections = secs.length ? secs.reduce((a, b) => a + b, 0) / secs.length : 0;
    const score = 0.35 * changes + 0.15 * chordsScore + 0.2 * strum + 0.15 * chant + 0.15 * sections;
    const parts = { changes, chords: chordsScore, strum, chant, sections };
    // goulot : la partie la plus en retard, avec un conseil concret
    let bottleneck = null;
    const unknown = chords.filter(c => !c.known);
    if (unknown.length) bottleneck = { kind: 'chord', id: unknown[0].id, text: 'Accord à apprendre : ' + T.pretty(T.voicing(unknown[0].id).sym) };
    else if (ch.length && ch[0].ratio < 0.9) bottleneck = { kind: 'pair', a: ch[0].a, b: ch[0].b, text: 'Changement ' + T.pretty(T.voicing(ch[0].a).sym) + ' → ' + T.pretty(T.voicing(ch[0].b).sym) + ' : ' + (ch[0].best ? ch[0].best + '/min, il en faut ' + ch[0].need : 'pas encore mesuré (il en faudra ' + ch[0].need + '/min)') };
    else if (strum < 0.9) bottleneck = { kind: 'strum', id: song.strum, text: 'Rythmique « ' + (T.strum(song.strum) || {}).name + ' » à ' + song.tempo + ' BPM (record : ' + (ps ? ps.best : 0) + ')' };
    else if (chant < 0.9) bottleneck = { kind: 'chant', id: song.strum, text: 'Chanter en jouant la rythmique à ' + song.tempo + ' BPM' };
    else if (sections < 0.9) { const i = secs.indexOf(Math.min(...secs)); bottleneck = { kind: 'section', sec: i, text: '« ' + info.sections[i].name + ' » en entier à tempo (record : ' + Math.round(100 * secs[i]) + ' %)' }; }
    return { score: +score.toFixed(3), parts, bottleneck, changes: ch, chords, sections: secs };
  };
  St.workSong = s => (s.songs || []).find(x => x.id === s.workSong) || null;

  /* ---------------------------------------------------------------- contexte des exercices */
  St.ctx = function (s, plan, extra) {
    const song = St.workSong(s);
    let songCtx = null, songPairs = [], songSeq = null;
    if (song) {
      const info = St.songInfo(song);
      if (info.ok) {
        songCtx = { id: song.id, title: song.title, tempo: song.tempo, strum: song.strum, bpc: song.bpc, sections: info.sections, diff: info.diff, capo: info.capo };
        const rd = St.readiness(s, song, info);
        songPairs = (rd ? rd.changes : []).filter(c => s.vocab.includes(c.a) && s.vocab.includes(c.b)).map(c => [c.a, c.b]);
        songSeq = info.seq.filter((x, i, arr) => i === 0 || x !== arr[i - 1]).slice(0, 4);
      }
    }
    const easy = ['Em', 'Asus2', 'Am', 'E', 'D'].find(id => s.vocab.includes(id)) || 'Em';
    return Object.assign({
      profile: s.profile, vocab: s.vocab.slice(), newChord: plan && plan.newChord || null,
      week: St.programWeek(s), block: plan ? plan.block : 1,
      level: comp => (s.skills[comp] ? s.skills[comp].th : 2),
      pairStat: (a, b) => St.pairStat(s, a, b),
      patternStat: id => s.patterns[id] || null,
      chordStat: id => s.chords[id] || null,
      song: songCtx, songPairs, songSeq, songLyrics: song ? song.lyrics : '',
      easyChord: easy, a4: s.profile.tuning || 440,
      // accords des 3 dernières semaines pas encore propres (moins de 2 vérifications réussies sur 3)
      freshChords: s.vocab.filter(id => { const c = s.chords[id]; return c && !c.declared && St.dayDiff(c.intro, today()) <= 21 && !(c.clean >= 0.66 && c.n >= 2); }),
    }, extra || {});
  };

  /* ---------------------------------------------------------------- une prise */
  /**
   * Enregistre une prise jugée : niveaux (principal + secondaires), statistiques de l'exercice, observation
   * directe, records d'accords, de paires et de rythmiques, séries, auto-évaluation.
   * take : {ex, params, d, judged:{y, success, metrics, observe, chord, pair, pattern…}, self, predicted}
   */
  St.recordTake = function (s, take, ts) {
    ts = ts || Date.now();
    const C = AC.catalog;
    const ex = C.EX[take.ex];
    const j = take.judged || {};
    let y = j.y, w = 1;
    if (y == null && take.self != null) { y = take.self; w = 0.5; }
    if (ex && ex.comp && s.skills[ex.comp]) s.skills[ex.comp].lastMain = ts;
    if (ex && ex.comp && y != null && isFinite(take.d)) {
      const p = M.update(s.skills[ex.comp], take.d, y, w, ts);
      for (const [c, cw] of Object.entries(ex.also || {})) if (s.skills[c]) M.nudge(s.skills[c], y - p, cw * w, ts);
    }
    if (j.observe && s.skills[j.observe.comp]) M.observe(s.skills[j.observe.comp], j.observe.level, j.observe.noise, ts);
    const it = s.items[take.ex] = s.items[take.ex] || { n: 0, ok: 0, last: 0, first: ts };
    it.n++; if (j.success) it.ok++; it.last = ts; it.lastD = take.d;
    if (j.chord) St.chordUpdate(s, j.chord.id, { clean: j.chord.clean, strings: j.chord.strings }, ts);
    if (j.forms) j.forms.forEach(f => St.chordUpdate(s, f.id, { rt: f.rt }, ts));
    if (j.pair) St.pairUpdate(s, j.pair.a, j.pair.b, j.pair.cpm, ts);
    if (j.rhythmPair) St.pairRhythm(s, j.rhythmPair.a, j.rhythmPair.b, j.rhythmPair.tempo, j.rhythmPair.bpc, ts);
    if (j.pattern) St.patternUpdate(s, 'patterns', j.pattern.id, j.pattern.tempo, j.metrics && j.metrics.mae, ts);
    if (j.pick) St.patternUpdate(s, 'picks', j.pick.id, j.pick.tempo, j.metrics && j.metrics.mae, ts);
    if (j.chant) St.patternUpdate(s, 'chant', j.chant.p, j.chant.tempo, j.metrics && j.metrics.mae, ts);
    if (j.song && j.song.ok) {
      const sg = (s.songs || []).find(x => x.id === j.song.id);
      if (sg) { sg.progress = sg.progress || {}; const eff = +(j.song.ratio * (j.song.mode === sg.strum ? 1 : 0.7)).toFixed(2); sg.progress[j.song.sec] = Math.max(sg.progress[j.song.sec] || 0, eff); }
    }
    const m = j.metrics || {};
    if (take.ex === 'pulse' && isFinite(m.sd)) St.addSeries(s, 'timingSd', m.sd, ts, 'min');
    if (take.ex === 'minute' && isFinite(m.cpm)) St.addSeries(s, 'cpm', m.cpm, ts, 'max');
    if (isFinite(m.jnd)) St.addSeries(s, 'jnd', m.jnd, ts, 'min');
    if (take.predicted && take.predicted !== '?' && j.y != null) {
      const truth = St.truthOf(take, j);
      if (truth) take.calib = St.addCalibration(s, take.predicted, truth);
    }
  };
  /** Vérité mesurée comparable à l'auto-évaluation (« avant de voir ») : propre / pas propre ; à l'heure / en avance / en retard. */
  St.truthOf = function (take, j) {
    const m = j.metrics || {};
    if (take.predictKind === 'clean') return j.success ? 'propre' : 'pas propre';
    if (take.predictKind === 'timing' && isFinite(m.mae)) return j.success ? 'en place' : 'pas en place';
    return j.success != null ? (j.success ? 'en place' : 'pas en place') : null;
  };
  St.addCalibration = function (s, pred, truth) {
    const hit = pred === truth ? 1 : 0;
    s.calib.n++; s.calib.hits += hit;
    s.calib.recent.push(hit); if (s.calib.recent.length > 30) s.calib.recent.shift();
    return { truth, hit };
  };
  St.calibRate = s => (s.calib.recent.length >= 5 ? s.calib.recent.reduce((a, b) => a + b, 0) / s.calib.recent.length : null);
  /** Photo de ce qu'une prise modifie (pour corriger une mesure après coup sans compter deux fois). */
  St.snapshot = (s, exId) => JSON.stringify({ skills: s.skills, item: s.items[exId] || null, calib: s.calib, series: s.series, chords: s.chords, pairs: s.pairs, patterns: s.patterns, picks: s.picks, chant: s.chant });
  St.restore = function (s, exId, snap) {
    const o = JSON.parse(snap);
    for (const k of ['skills', 'calib', 'series', 'chords', 'pairs', 'patterns', 'picks', 'chant']) s[k] = o[k];
    if (o.item) s.items[exId] = o.item; else delete s.items[exId];
  };

  /* ---------------------------------------------------------------- cartes */
  St.cardsAvailable = s => R.available(St.programWeek(s), s.vocab.filter(id => !String(id).includes(':')));
  St.reviewCard = function (s, id, correct, sec, ts) {
    const day = today(ts), prev = s.cards[id];
    const g = R.grade(correct, sec);
    const c = R.review(prev, g, day);
    if (!prev) c.first = day;
    s.cards[id] = c;
    const card = R.card(id);
    if (card && s.skills.harmonie) M.update(s.skills.harmonie, card.b, correct ? 1 : 0, 0.25, ts);
    return c;
  };

  /* ---------------------------------------------------------------- séances */
  St.startSession = function (s, plan, ts) {
    const sess = { id: 's' + (ts || Date.now()), date: today(ts), ts: ts || Date.now(), type: plan.type, week: plan.week, bilanWeek: plan.bilanWeek || null, planned: plan.minutes, checkin: plan.checkin || null, takes: [], done: false, load: 0 };
    if (plan.type === 'B') { sess.startSkills = {}; for (const [k, v] of Object.entries(s.skills)) sess.startSkills[k] = { th: v.th, sd: v.sd }; }
    if (plan.newChord) St.introduce(s, plan.newChord, ts);
    (plan.introduce || []).forEach(id => St.introduce(s, id, ts));
    return sess;
  };
  St.dropSession = (s, id) => { s.sessions = s.sessions.filter(x => x.id !== id); };
  St.finishSession = function (s, sess, ts, partial) {
    St.dropSession(s, sess.id);
    sess.done = !partial; sess.partial = !!partial; sess.end = ts || Date.now();
    sess.minutes = Math.min(180, Math.round((isFinite(sess.activeMs) ? sess.activeMs : sess.end - sess.ts) / 60000));
    const compact = Object.assign({}, sess, { startSkills: undefined, takes: sess.takes.map(t => ({ ex: t.ex, d: +(+t.d || 0).toFixed(2), y: t.judged ? t.judged.y : null, ok: t.judged ? t.judged.success : null, self: t.self, pred: t.predicted, m: t.judged ? t.judged.metrics : null, pain: t.pain || undefined, disputed: t.disputed != null ? t.disputed : undefined })) });
    const prev = s.sessions[s.sessions.length - 1];
    if (prev) { const gap = St.dayDiff(prev.date, sess.date); if (gap > 4) s.program.pausedDays += gap - 4; }
    s.sessions.push(compact);
    if (s.sessions.length > 600) s.sessions.splice(0, s.sessions.length - 600);
    return compact;
  };
  St.maybeNewCycle = function (s, dateStr) {
    const d = dateStr || today();
    const eff = St.dayDiff(s.program.start, d) - (s.program.pausedDays || 0);
    const final = s.bilans.some(b => b.week === 16 && b.cycle === s.program.cycle);
    if ((final && eff >= 15 * 7) || eff >= 18 * 7) { s.program.cycle = (s.program.cycle || 1) + 1; s.program.start = d; s.program.pausedDays = 0; return true; }
    return false;
  };
  St.programWeek = function (s, dateStr) {
    const eff = St.dayDiff(s.program.start, dateStr || today()) - (s.program.pausedDays || 0);
    return Math.min(16, Math.floor(Math.max(0, eff) / 7) + 1);
  };

  /* ---------------------------------------------------------------- sauvegarde */
  St.exportJSON = s => JSON.stringify({ app: 'ACCORD', v: St.VERSION, exportedAt: new Date().toISOString(), state: s });
  St.importJSON = function (txt) {
    const o = JSON.parse(txt);
    if (o && o.app === 'ACCORD' && o.state) return St.migrate(o.state);
    throw new Error('Fichier non reconnu (ce n’est pas une sauvegarde ACCORD).');
  };
  /**
   * Données de l'ancienne app « Corde » (même adresse, même téléphone) : jours de pratique, records de tempo,
   * auto-évaluations. Elles servent à choisir le point de départ ; le bilan d'entrée mesure ensuite.
   * get : (clé) → valeur JSON lue dans le stockage du navigateur.
   */

      else if (st.t === 'compose') { compose = await stepCompose(st, head); res = compose; }
    }
    let judged = res || ex.kind === 'quiz' || ex.kind === 'compose' ? ex.judge(res, params, ctx, { multi, score: RS.lastScore, t0: rec && rec.t0rel }) : { y: null, success: null, fb: [] };
    if (!judged) judged = { y: null, success: null, fb: [] };
    // deviner avant de voir : entraîne l'écoute de soi (Guadagnoli & Kohl 2001)
    let predicted = null, predictKind = null;
    if (ex.kind === 'play' && judged.y != null && s.profile.predict && RS.mic && !item.bilan) {
      const n = s.calib.recent.length;
      if (Math.random() < (n < 10 ? 0.5 : 0.3)) { predictKind = ['propre', 'barre', 'forme'].includes(ex.id) ? 'clean' : 'timing'; predicted = await askPredict(predictKind, head); }
    }
    let self = null;
    if (song) self = song.self;
    else if (compose) self = compose.self;
    else if (judged.y == null && (ex.kind === 'play') && !(ex.id === 'releve')) self = await askSelf(head, judged.fb);
    const take = { ex: ex.id, params, d, judged, self, predicted, predictKind, ts: Date.now() };
    const snap = St.snapshot(s, ex.id);
    St.recordTake(s, take, take.ts);
    if (ex.id === 'cartes' || ex.kind === 'quiz') { /* les cartes sont notées une à une pendant le quiz */ }
    const entry = { ex: ex.id, params, d, judged: { y: judged.y, success: judged.success, metrics: judged.metrics, observe: judged.observe }, self, predicted };
    RS.sess.takes.push(entry);
    RS.sess.load = (RS.sess.load || 0) + (ex.load != null ? ex.load : 1);
    save();
    RS.last = { snap, take, entry, block: { fails: RS.block.fails, offset: RS.block.offset } };
    adapt(item, judged.y != null ? judged.y : self);
    if (song || compose || ex.kind === 'quiz' && !judged.fb.length) return 'next';
    return showResult(ex, params, res, judged, take, rec, head);
  }
  /** Escalier du bloc : deux ratés → plus facile ; une réussite → un peu plus dur. Échelles de bilan : on monte tant que ça passe. */
  function adapt(item, y) {
    if (y == null) return;
    if (y === 0) { RS.block.fails++; if (RS.block.fails >= 2) { RS.block.offset += 0.6; RS.block.fails = 0; } }
    else if (y === 1) { RS.block.fails = 0; RS.block.offset = Math.max(0, RS.block.offset - 0.3); }
    if (item.ladder) { if (y < 1) RS.block.ladderFails++; if (RS.block.ladderFails >= 2) RS.block.stop = true; }
  }

  /* ------------------------------------------------------------ étapes */
  async function stepShow(st, head, nx) {
    let vis = '';
    if (st.songSection) vis += songGrid(st.songSection.song, st.songSection.sec);
    if (st.v && st.v.length) vis += U.diagrams(st.v, { size: st.v.length === 1 ? 'big' : null });
    if (st.pattern) vis += `<div style="margin-top:8px">${U.pattern(st.pattern)}</div>`;
    if (st.pick) vis += `<div style="margin-top:8px">${U.pickPattern(st.pick, st.v && st.v[0])}</div>`;
    if (st.text) vis += `<div class="card flat"><p>${esc(st.text)}</p></div>`;
    frame(`<div class="center"><h2>${esc(st.label || '')}</h2>${st.sub ? `<p class="muted small" style="margin-top:4px">${esc(st.sub)}</p>` : ''}</div>${vis}`, btn('show-ok', nx && nx.t === 'listen' ? 'Écouter le modèle' : 'Prêt', 'primary big block'), head);
    await U.wait(['show-ok']);
  }
  function songGrid(songId, secIdx, now, marks) {
    const s = S(), song = s.songs.find(x => x.id === songId);
    if (!song) return '';
    const info = St.songInfo(song), sec = info.ok ? info.sections[secIdx] : null;
    if (!sec) return '';
    return `<div class="grid">${sec.bars.map((b, i) => `<div class="barc ${now === i ? 'now' : ''} ${marks && marks[i] != null ? (marks[i] ? 'ok' : 'ko') : ''}">${b.map(vSym).join(' ')}</div>`).join('')}</div>`;
  }
  const volRow = () => `<div class="row" style="justify-content:center;gap:8px">${btn('vol', '🔉 −', 'small ghost', '-0.25')}<span class="small muted">Volume ${Math.round(100 * (S().profile.volume || 1))} %</span>${btn('vol', '🔊 +', 'small ghost', '0.25')}</div>`;
  function stepVolume(delta) { const p = S().profile; p.volume = Math.max(0.5, Math.min(2, Math.round(((p.volume || 1) + delta) * 100) / 100)); A.setUserVolume(p.volume); save(); }
  async function stepListen(st, head, okLabel) {
    await ensureSound(head);
    frame(stage(st.label || 'Écoute', st.sub || 'Écoute une fois, attentivement.', '<div class="pulse"></div>'), '', head);
    await A.play(st.play);
    const ready = () => frame(stage(st.label || 'Écoute', st.sub || 'Prêt ?', '<div class="pulse" style="animation:none;opacity:.5"></div>'), btn('listen-ok', okLabel || 'À moi', 'primary big block') + btn('replay-model', 'Réécouter', 'ghost block') + volRow(), head);
    ready();
    for (;;) {
      const a = await U.wait(['listen-ok', 'replay-model', 'vol']);
      if (a.act === 'listen-ok') return;
      if (a.act === 'vol') { stepVolume(+a.arg); ready(); continue; }
      await ensureSound(head); await A.play(st.play);
    }
  }
  async function stepWait(st, head) {
    frame(stage(st.label, esc(st.sub || ''), '<div style="font-size:44px">🎸</div>'), btn('wait-ok', st.button || 'Suivant', 'primary big block') + (st.replay ? btn('wait-replay', 'Réécouter', 'ghost block') : ''), head);
    for (;;) { const a = await U.wait(['wait-ok', 'wait-replay']); if (a.act === 'wait-ok') return; await ensureSound(head); await A.play(st.replay); }
  }

  /** Prise au micro. Renvoie {res, pcm, sr} ou {interrupted}. */
  async function stepPlay(ex, st, params, head) {
    const s = S(), kind = st.rec.kind;
    if (!RS.mic) return manualPlay(st, head);
    await ensureSound(head);
    if (!A.micAlive()) { try { await A.openMic(); } catch (e) { /* on tente quand même */ } }
    const hid0 = RS.hidden;
    let out;
    if (kind === 'rhythm') out = await playRhythm(ex, st, head);
    else if (kind === 'changes') out = await playChanges(st, head);
    else if (kind === 'cues') out = await playCues(st, head);
    else out = await playPlucks(st, head);
    if (RS.aborted) throw ABORT;
    if (RS.hidden !== hid0) {
      frame(stage('Prise interrompue', 'L’écran s’est verrouillé ou l’app est passée en arrière-plan : cette prise ne compte pas.', '<div style="font-size:44px">⏸</div>'), btn('retake', 'Refaire la prise', 'primary big block'), head);
      await U.wait(['retake']);
      return { interrupted: true };
    }
    frame(stage('Analyse…', '', '<div class="pulse"></div>'), '', head);
    await U.frame();
    const a4 = s.profile.tuning || 440;
    let res = null;
    try {
      if (kind === 'rhythm') {
        const spec = out.spec; spec.a4 = a4;
        res = D.analyzeRhythm(out.pcm, out.sr, spec);
        if (res && res.latencySrc === 'mesurée' && isFinite(res.latency)) {
          const L0 = s.profile.latency;
          s.profile.latency = L0 && isFinite(L0) ? +(0.7 * L0 + 0.3 * res.latency).toFixed(4) : +res.latency.toFixed(4);
        }
        if (res && st.rec.voice) { const tr = D.trackVoice(out.pcm, out.sr, { a4 }); res.voiceShare = D.voiceShare(tr, spec.events[0].t + 60 / out.score.tempo * out.score.sig, spec.events[spec.events.length - 1].t); }
      } else if (kind === 'changes') res = D.analyzeChanges(out.pcm, out.sr, { a: st.rec.a, b: st.rec.b, t0: out.t0rel, t1: out.t1rel, a4 });
      else if (kind === 'cues') res = D.analyzeCues(out.pcm, out.sr, Object.assign(out.spec, { a4 }));
      else res = D.analyzePlucks(out.pcm, out.sr, { v: st.rec.v, a4 });
    } catch (e) { console.error(e); res = null; }
    RS.lastRec = { pcm: out.pcm, sr: out.sr };
    if (st.rec.save && out.pcm && out.pcm.length) {
      try { const x22 = D.resample(out.pcm, out.sr, 22050); const song = St.workSong(s); await Store.saveRec(x22, 22050, { ex: ex.id, kind: 'song', song: song ? song.id : null, label: (song ? song.title : 'Chanson') + ' · ' + (head.sub || '') }); } catch (e) { /* stockage plein */ }
    }
    return { res, pcm: out.pcm, sr: out.sr, t0rel: out.t0rel };
  }
  /** Sans micro : on joue avec le guide (métronome, motif), puis auto-évaluation. */
  async function manualPlay(st, head) {
    if (st.score) {
      const sc = st.score, beat = 60 / sc.tempo;
      const t0 = A.now() + 0.4;
      const ck = A.scheduleClicks(sc, t0, 'bois');
      frame(stage('Joue avec le clic', 'Décompte d’une mesure', guideHtml(sc)), btn('rec-stop', 'J’ai fini', 'ghost block'), head);
      await guideLoop(sc, t0, ck.end, null);
      void beat;
    } else {
      frame(stage(st.label, esc(st.sub || ''), '<div style="font-size:44px">🎸</div>'), btn('rec-stop', 'J’ai fini', 'primary big block'), head);
      await U.wait(['rec-stop']);
    }
    return { res: null };
  }

  /* --- guide visuel pendant une prise rythmée : points de temps, case du motif, accord en cours */
  function guideHtml(sc) {
    const dots = Array.from({ length: sc.sig }, (_, i) => `<i class="${i === 0 ? 'first' : ''}"></i>`).join('');
    return `<div id="gChord" class="bigchord">${esc(vSym(sc.seq[0]))}<small id="gNext"></small></div><div class="beatdots" id="gDots">${dots}</div>${sc.strum ? `<div id="gPat" style="width:100%">${U.pattern(sc.strum)}</div>` : sc.pick ? `<div id="gPat" style="width:100%">${U.pickPattern(sc.pick, sc.seq[0])}</div>` : ''}<div id="gMsg" class="sub"></div>`;
  }
  async function guideLoop(sc, t0, tEnd, onTick) {
    const beat = 60 / sc.tempo, start = t0 + sc.countIn * beat;
    let stop = false;
    U.wait(['rec-stop']).then(a => { if (a) stop = true; }).catch(() => { stop = true; });
    let lastSlot = -2;
    while (!stop && A.now() < tEnd + 0.4) {
      if (RS && RS.aborted) break;
      const now = A.now();
      const dots = document.getElementById('gDots'), chordEl = document.getElementById('gChord'), msg = document.getElementById('gMsg');
      if (now < start) {
        const i = Math.floor((now - t0) / beat);
        if (dots) [...dots.children].forEach((d, j) => d.classList.toggle('on', j === i % sc.sig));
        if (msg) msg.textContent = 'Décompte… ' + Math.max(1, sc.countIn - i);
      } else {
        const pos = (now - start) / beat, bi = Math.floor(pos), bar = Math.floor(bi / sc.sig);
        if (dots) [...dots.children].forEach((d, j) => { d.classList.toggle('on', j === bi % sc.sig); d.classList.toggle('mute', !sc.clickBars[bar]); });
        const ci = Math.floor(pos / sc.bpc) % sc.seq.length, cur = sc.seq[ci], nxt = sc.seq[(ci + 1) % sc.seq.length];
        if (chordEl && chordEl.firstChild) chordEl.firstChild.nodeValue = vSym(cur);
        const ng = document.getElementById('gNext'); if (ng) ng.textContent = nxt !== cur ? 'ensuite : ' + vSym(nxt) : '';
        const slot = Math.floor(pos * sc.sub) % (sc.sig * sc.sub);
        if (slot !== lastSlot) { const pat = document.getElementById('gPat'); if (pat) [...pat.querySelectorAll('.slot')].forEach((x, j) => x.classList.toggle('now', j === slot)); lastSlot = slot; }
        if (msg) msg.textContent = sc.clickBars[bar] === false ? 'Le clic se tait : continue au même tempo…' : bar >= sc.bars ? '' : 'Mesure ' + (bar + 1) + '/' + sc.bars;
        if (onTick) onTick(pos);
      }
      await new Promise(r => requestAnimationFrame(r));
    }
    U.cancel(['rec-stop']);
    return stop;
  }
  async function playRhythm(ex, st, head) {
    const sc = st.score;
    A.startRec();
    frame(stage(st.label, esc(st.voiceText || ''), guideHtml(sc)), btn('rec-stop', 'Arrêter', 'ghost block'), head);
    await U.sleep(350);
    const t0 = A.now() + 0.5;
    const ck = A.scheduleClicks(sc, t0, A.clickKind);
    const tEnd = ck.end + 0.6;
    await guideLoop(sc, t0, tEnd);
    while (A.now() < tEnd) await U.sleep(50);
    const r = A.stopRec();
    const recT0 = r.t0 != null ? r.t0 : t0 - 0.85;
    const rel = t => t - recT0;
    const start = ck.start;
    const spec = C.rhythmSpec(sc, rel(start), ck.times.map(c => rel(c.t)), isFinite(S().profile.latency) ? S().profile.latency : A.outputLatency() + 0.03);
    return { pcm: r.pcm, sr: r.sr, spec, score: sc, t0rel: rel(start) };
  }
  async function playChanges(st, head) {
    for (const n of [3, 2, 1]) { frame(stage(String(n), esc(st.sub || ''), U.diagrams([st.rec.a, st.rec.b], { size: 'small' })), '', head); await U.sleep(700); if (RS.aborted) throw ABORT; }
    A.startRec();
    const tStart = Date.now();
    let stop = false;
    frame(stage('Alterne ! ' + vSym(st.rec.a) + ' ⇄ ' + vSym(st.rec.b), '', U.ring(0, st.sec + ' s') + U.diagrams([st.rec.a, st.rec.b], { size: 'small' })), btn('rec-stop', 'Arrêter', 'ghost block'), head);
    U.wait(['rec-stop']).then(a => { if (a) stop = true; }).catch(() => { stop = true; });
    while (!stop && (Date.now() - tStart) / 1000 < st.sec) {
      const left = st.sec - (Date.now() - tStart) / 1000;
      const ring = el && el.querySelector('.stage .ring'); if (ring) ring.outerHTML = U.ring(1 - left / st.sec, Math.ceil(left) + ' s');
      await U.sleep(250);
      if (RS.aborted) break;
    }
    U.cancel(['rec-stop']);
    const r = A.stopRec();
    const dur = r.pcm.length / r.sr;
    return { pcm: r.pcm, sr: r.sr, t0rel: 0.15, t1rel: Math.min(dur, st.sec + 0.2) };
  }
  async function playCues(st, head) {
    const cues = st.rec.cues;
    A.startRec();
    frame(stage(st.label, '', '<div id="cueBox" class="bigchord">…</div><div class="rec-dot"></div>'), btn('rec-stop', 'Arrêter', 'ghost block'), head);
    await U.sleep(300);
    const t0 = A.now() + 0.2;
    cues.forEach(c => A.clickAt(t0 + c.at, true, 'aigu'));
    const tEnd = t0 + st.sec;
    let stop = false;
    U.wait(['rec-stop']).then(a => { if (a) stop = true; }).catch(() => { stop = true; });
    while (!stop && A.now() < tEnd) {
      const now = A.now() - t0;
      const cur = cues.filter(c => c.at <= now).pop();
      const box = document.getElementById('cueBox');
      if (box) box.innerHTML = cur ? (st.hidden ? '🎸' : esc(vSym(cur.v)) + `<small>${esc(T.chordFr(T.voicing(cur.v).sym))}</small>`) : '…';
      await U.sleep(60);
      if (RS.aborted) break;
    }
    U.cancel(['rec-stop']);
    const r = A.stopRec();
    const recT0 = r.t0 != null ? r.t0 : t0 - 0.5;
    const spec = { cues: cues.map(c => ({ t: t0 + c.at - recT0, v: c.v, limit: c.limit })), clicks: cues.map(c => t0 + c.at - recT0), latency: isFinite(S().profile.latency) ? S().profile.latency : A.outputLatency() + 0.03, vocab: (st.rec.vocab || []).map(id => T.voicing(id)).filter(Boolean) };
    if (!spec.vocab.length) spec.vocab = St.ctx(S(), RS.plan).vocab.map(id => T.voicing(id)).filter(Boolean);
    return { pcm: r.pcm, sr: r.sr, spec };
  }
  async function playPlucks(st, head) {
    const v = T.voicing(st.rec.v), n = T.sounding(v).length;
    A.startRec();
    const tStart = Date.now();
    let stop = false, heard = 0, quietSince = 0, lastLoud = 0;
    const noise = A.level();
    frame(stage(st.label, esc(st.sub || ''), U.diagram(st.rec.v, { size: 'big' }) + '<div class="meter" style="margin:6px auto 0"><b id="mtr"></b></div>'), btn('rec-stop', 'J’ai fini', 'primary block'), head);
    U.wait(['rec-stop']).then(a => { if (a) stop = true; }).catch(() => { stop = true; });
    while (!stop && (Date.now() - tStart) / 1000 < st.sec + 6) {
      const lv = A.level(), loud = lv > Math.min(-38, Math.max(noise + 14, -55));
      if (loud) { if (Date.now() - lastLoud > 250) heard++; lastLoud = Date.now(); quietSince = 0; } else if (heard && !quietSince) quietSince = Date.now();
      const m = document.getElementById('mtr'); if (m) m.style.width = Math.max(0, Math.min(100, (lv + 60) / 60 * 100)) + '%';
      if (heard >= n && quietSince && Date.now() - quietSince > 1500) break;
      await U.sleep(80);
      if (RS.aborted) break;
    }
    U.cancel(['rec-stop']);
    await U.sleep(200);
    const r = A.stopRec();
    return { pcm: r.pcm, sr: r.sr };
  }

  /* ------------------------------------------------------------ quiz */
  async function runQuiz(st, head) {
    if (st.quiz === 'discri') return quizDiscri(st, head);
    if (st.quiz === 'qualite') return quizQualite(st, head);
    if (st.quiz === 'degres') return quizDegres(st, head);
    if (st.quiz === 'cartes') return quizCartes(st, head);
    return null;
  }
  async function quizDiscri(st, head) {
    const z = C.zest.init(35, 2.2);
    for (let i = 0; i < st.trials; i++) {
      const cents = C.zest.next(z), base = 55 + Math.floor(Math.random() * 9), up = Math.random() < 0.5;
      const q = { kind: 'pair', a: base, b: base + (up ? 1 : -1) * cents / 100, gap: 1.0 };
      await ensureSound(head);
      frame(stage('Écoute les deux notes', 'Essai ' + (i + 1) + '/' + st.trials + ' · écart ' + Math.round(cents) + ' cents', '<div class="pulse"></div>'), '', head);
      await U.sleep(250); await A.play(q);
      frame(stage('La 2ᵉ note était…', 'Essai ' + (i + 1) + '/' + st.trials), `<div class="predict">${btn('q-ans', '▲ Plus haute', 'big', 'up')}${btn('q-ans', '▼ Plus basse', 'big', 'down')}</div>` + btn('q-replay', 'Réécouter', 'ghost small'), head);
      let a;
      for (;;) { a = await U.wait(['q-ans', 'q-replay']); if (a.act === 'q-ans') break; await ensureSound(head); await A.play(q); }
      const ok = (a.arg === 'up') === up;
      C.zest.update(z, cents, ok);
      frame(stage(ok ? '✓ Oui' : '✗ Non', ok ? '' : 'Elle était ' + (up ? 'plus haute' : 'plus basse') + '.'), '', head);
      await U.sleep(600);
    }
    const est = C.zest.estimate(z);
    return { threshold: est.threshold, lo80: est.lo80, hi80: est.hi80, correct: est.correct, n: est.n };
  }
  const Q_NAMES = { '': 'Majeur', m: 'Mineur', '7': '7 (septième)', sus4: 'sus4', sus2: 'sus2', maj7: 'maj7', m7: 'm7' };
  async function quizQualite(st, head) {
    const set = C.QUALITY_SETS[st.set].opts;
    let correct = 0; const conf = {};
    for (let i = 0; i < st.n; i++) {
      const q = set[Math.floor(Math.random() * set.length)];
      const root0 = [0, 2, 4, 7, 9][Math.floor(Math.random() * 5)];
      const pl = T.playable(T.chordSym({ root: root0, q })) || T.playable(T.chordSym({ root: 9, q }));
      if (!pl || pl.simplified) { i--; continue; }
      const model = st.arp ? { kind: 'arp', v: pl.v.id, gap: 0.22 } : { kind: 'strum', v: pl.v.id };
      await ensureSound(head);
      frame(stage('Écoute', 'Question ' + (i + 1) + '/' + st.n, '<div class="pulse"></div>'), '', head);
      await A.play(model);
      frame(stage('Cet accord est…', 'Question ' + (i + 1) + '/' + st.n), `<div class="predict">${set.map(x => btn('q-ans', esc(Q_NAMES[x]), 'big', x)).join('')}</div>` + btn('q-replay', 'Réécouter', 'ghost small'), head);
      let a;
      for (;;) { a = await U.wait(['q-ans', 'q-replay']); if (a.act === 'q-ans') break; await ensureSound(head); await A.play(model); }
      const ok = a.arg === q;
      if (ok) correct++; else { const k = Q_NAMES[q] + ' pris pour ' + Q_NAMES[a.arg]; conf[k] = (conf[k] || 0) + 1; }
      frame(stage(ok ? '✓ ' + Q_NAMES[q] : '✗ C’était ' + Q_NAMES[q], esc(T.chordLong(pl.v.sym))), '', head);
      await U.sleep(800);
    }
    const top = Object.entries(conf).sort((a, b) => b[1] - a[1])[0];
    return { correct, n: st.n, confusions: top ? 'Confusion la plus fréquente : ' + top[0] + ' (' + top[1] + '×).' : '' };
  }
  async function quizDegres(st, head) {
    let correct = 0; const conf = {};
    const keys = [7, 0, 2, 9, 4];
    for (let i = 0; i < st.n; i++) {
      const key = keys[Math.floor(Math.random() * keys.length)];
      let model, answer, opts;
      if (st.prog) {
        const cands = T.PROGRESSIONS.filter(p => p.deg.length === 4 && p.deg.every(dg => st.set.includes(dg) || ['I', 'IV', 'V', 'vi'].includes(dg)));
        const pick3 = cands.sort(() => Math.random() - 0.5).slice(0, 3);
        const target = pick3[0];
        const seq = target.deg.map(dg => T.playable(T.degreeChord(dg, key)).v.id);
        model = { kind: 'cadence', key, then: seq };
        answer = target.name; opts = pick3.map(p => p.name).sort(() => Math.random() - 0.5);
      } else {
        const dg = st.set[Math.floor(Math.random() * st.set.length)];
        const pl = T.playable(T.degreeChord(dg, key));
        model = { kind: 'cadence', key, then: pl.v.id };
        answer = dg; opts = st.set;
      }
      await ensureSound(head);
      frame(stage('Tonalité, puis l’accord', 'Question ' + (i + 1) + '/' + st.n + ' · en ' + esc(T.keyName(key, false)), '<div class="pulse"></div>'), '', head);
      await A.play(model);
      frame(stage(st.prog ? 'Quelle progression ?' : 'Quel degré ?', 'Question ' + (i + 1) + '/' + st.n), `<div class="${st.prog ? 'col' : 'predict'}">${opts.map(x => btn('q-ans', esc(x), st.prog ? 'block' : 'big', x)).join('')}</div>` + btn('q-replay', 'Réécouter', 'ghost small'), head);
      let a;
      for (;;) { a = await U.wait(['q-ans', 'q-replay']); if (a.act === 'q-ans') break; await ensureSound(head); await A.play(model); }
      const ok = a.arg === answer;
      if (ok) correct++; else { const k = answer + ' pris pour ' + a.arg; conf[k] = (conf[k] || 0) + 1; }
      const chordTxt = !st.prog ? ' (' + T.pretty(T.degreeChord(answer, key)) + ' en ' + T.keyName(key, false) + ')' : '';
      frame(stage(ok ? '✓ ' + answer : '✗ C’était ' + answer, esc(chordTxt)), '', head);
      await U.sleep(900);
    }
    const top = Object.entries(conf).sort((a, b) => b[1] - a[1])[0];
    return { correct, n: st.n, confusions: top ? 'À retravailler : ' + top[0] + '.' : '' };
  }
  async function quizCartes(st, head) {

  const CONSTRAINTS = [
    'Une boucle de 4 accords qui commence sur I et utilise vi.',
